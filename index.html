<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptHub · 精选 AI 提示词库</title>
<meta name="description" content="精选 ChatGPT、Claude、DeepSeek 提示词模板。双语、分类、社区驱动。中英文高质量提示词，让 AI 输出提升 10 倍。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f5f7;--card:#fff;--primary:#5558e0;--primary-dark:#4345c0;
  --primary-light:#eeeffa;--primary-bg:rgba(85,88,224,0.06);
  --text:#171923;--text2:#5a6170;--text3:#8b92a0;
  --border:#e2e5ea;--border2:#d0d4dd;
  --radius:10px;--radius-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.03);
  --shadow-hover:0 6px 20px rgba(0,0,0,0.06),0 2px 6px rgba(0,0,0,0.04);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}

/* Layout */
.nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-brand{display:flex;align-items:center;gap:0.5rem;font-weight:700;font-size:1rem;color:var(--primary)}
.nav-brand span{color:var(--text2);font-weight:400;font-size:0.85rem}
.nav-stats{display:flex;gap:1.2rem;font-size:0.8rem;color:var(--text3)}
.nav-stats strong{color:var(--text);font-weight:600}

.hero{background:linear-gradient(135deg,#5558e0 0%,#7c5ce0 50%,#a855f7 100%);color:#fff;padding:3.5rem 1.5rem 3rem;text-align:center}
.hero h1{font-size:2rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:0.4rem}
.hero p{font-size:0.95rem;opacity:0.88;max-width:560px;margin:0 auto;line-height:1.7}

.container{max-width:1240px;margin:0 auto;padding:1.25rem 1.5rem;display:flex;gap:1.5rem}
.sidebar{width:184px;flex-shrink:0}
.sidebar-sticky{position:sticky;top:72px}
.sidebar h3{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);font-weight:600;margin-bottom:0.6rem}
.cat-list{display:flex;flex-direction:column;gap:2px}
.cat-btn{background:none;border:none;display:flex;align-items:center;width:100%;padding:0.5rem 0.75rem;border-radius:8px;font-size:0.85rem;cursor:pointer;color:var(--text2);transition:all .12s;font-family:inherit;font-weight:500;text-align:left;gap:0.4rem}
.cat-btn:hover{background:var(--primary-bg);color:var(--primary)}
.cat-btn.active{background:var(--primary);color:#fff;font-weight:600}
.cat-btn .count{font-size:0.7rem;opacity:.55;margin-left:auto;font-weight:400}
.sidebar-actions{margin-top:1rem;display:flex;flex-direction:column;gap:6px}
.sidebar-actions button{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.55rem;font-size:0.82rem;cursor:pointer;color:var(--text2);transition:all .12s;font-family:inherit;font-weight:500}
.sidebar-actions button:hover{border-color:var(--primary);color:var(--primary)}
.sidebar-actions .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.sidebar-actions .btn-primary:hover{background:var(--primary-dark);color:#fff}

.main{flex:1;min-width:0}
.toolbar{display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.search-wrap{flex:1;min-width:180px;position:relative}
.search-wrap input{width:100%;padding:0.6rem 0.9rem 0.6rem 2.2rem;border:1px solid var(--border);border-radius:10px;font-size:0.88rem;outline:none;font-family:inherit;background:var(--card);transition:border .15s}
.search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(85,88,224,0.08)}
.search-wrap .icon{position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:var(--text3);font-size:0.9rem;pointer-events:none}
.sort-btn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0.6rem 0.9rem;font-size:0.82rem;cursor:pointer;color:var(--text2);transition:all .12s;font-family:inherit;white-space:nowrap}
.sort-btn:hover{border-color:var(--primary);color:var(--primary)}
.sort-btn.active{background:var(--primary-bg);border-color:var(--primary);color:var(--primary)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:0.75rem;margin-bottom:2rem}

/* Card */
.pcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.2rem;transition:all .2s;cursor:pointer}
.pcard:hover{box-shadow:var(--shadow-hover);border-color:var(--border2);transform:translateY(-1px)}
.pcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.35rem}
.pcard-cat{padding:0.18rem 0.55rem;border-radius:6px;font-size:0.7rem;font-weight:600;background:var(--primary-light);color:var(--primary);letter-spacing:.01em}
.pcard-author{font-size:0.72rem;color:var(--text3)}
.pcard-title{font-size:0.92rem;font-weight:600;margin-bottom:0.2rem;line-height:1.4}
.pcard-desc{font-size:0.8rem;color:var(--text2);margin-bottom:0.65rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard-preview{background:#f8f9fb;border-radius:8px;padding:0.65rem 0.75rem;font-size:0.72rem;color:#374151;font-family:'SF Mono','Consolas','Menlo',monospace;white-space:pre-wrap;max-height:72px;overflow:hidden;position:relative;line-height:1.5}
.pcard-preview::after{content:'';position:absolute;bottom:0;left:0;right:0;height:28px;background:linear-gradient(transparent,#f8f9fb)}
.pcard-footer{display:flex;align-items:center;gap:0.6rem;margin-top:0.65rem;padding-top:0.55rem;border-top:1px solid #f1f2f5;font-size:0.75rem;color:var(--text3)}
.vote-btn{background:none;border:none;cursor:pointer;font-size:0.95rem;padding:0;transition:transform .1s;line-height:1;color:var(--text3)}
.vote-btn:hover{transform:scale(1.2);color:var(--primary)}
.vote-btn.voted{color:var(--primary)}
.copy-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:0.15rem 0.5rem;font-size:0.7rem;cursor:pointer;color:var(--text3);transition:all .12s;font-family:inherit;margin-left:auto}
.copy-btn:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.lang-badge{font-size:0.65rem;padding:0.1rem 0.4rem;border-radius:4px;background:#e8eaf0;color:var(--text3)}
.date-badge{font-size:0.7rem;color:#a0a7b4}

/* Detail modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:200;padding:1rem;overflow-y:auto}
.modal-overlay.active{display:block}
.modal-wrap{max-width:760px;margin:2rem auto;background:var(--card);border-radius:var(--radius-lg);padding:2rem;position:relative}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--text3);width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .12s}
.modal-close:hover{background:#f1f2f5}
.modal-cat{display:inline-block;padding:0.2rem 0.65rem;border-radius:6px;font-size:0.75rem;font-weight:600;background:var(--primary-light);color:var(--primary);margin-bottom:0.5rem}
.modal-title{font-size:1.3rem;font-weight:700;margin-bottom:0.4rem}
.modal-desc{color:var(--text2);font-size:0.9rem;margin-bottom:1rem}
.modal-langs{display:flex;gap:1rem;margin-bottom:1rem}
.lang-tab{background:none;border:none;padding:0.4rem 0;font-size:0.82rem;cursor:pointer;color:var(--text3);font-weight:500;font-family:inherit;border-bottom:2px solid transparent;transition:all .12s}
.lang-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.modal-prompt{background:#f8f9fb;border-radius:10px;padding:1rem;font-size:0.82rem;color:#374151;font-family:'SF Mono','Consolas','Menlo',monospace;white-space:pre-wrap;line-height:1.6;max-height:400px;overflow-y:auto}
.modal-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;padding-top:0.8rem;border-top:1px solid #f1f2f5}
.modal-votes{display:flex;align-items:center;gap:0.4rem;font-size:0.88rem;color:var(--text2)}

/* Donate */
.donate{background:linear-gradient(135deg,#fefce8,#fef9c3);border:1px solid #fde68a;border-radius:var(--radius-lg);padding:1.5rem;text-align:center;margin-bottom:1rem}
.donate h3{font-size:1rem;color:#92400e;margin-bottom:0.2rem}
.donate p{font-size:0.8rem;color:#a16207;margin-bottom:0.8rem}
.donate img{width:140px;height:140px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.06);display:block;margin:0 auto}
.donate .hint{font-size:0.72rem;color:#a16207;margin-top:0.4rem}

/* Empty state */
.empty{padding:3rem;text-align:center;color:var(--text3);font-size:0.9rem}

footer{padding:1.5rem;text-align:center;font-size:0.78rem;color:var(--text3);border-top:1px solid var(--border);background:var(--card)}
footer a{color:var(--primary)}

@media(max-width:900px){
  .container{flex-direction:column}
  .sidebar{width:100%}
  .cat-list{flex-direction:row;flex-wrap:wrap;gap:4px}
  .cat-btn{flex:1;min-width:80px;justify-content:center;padding:0.4rem 0.5rem;font-size:0.78rem}
  .grid{grid-template-columns:1fr}
  .hero h1{font-size:1.5rem}
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-brand">✦ PromptHub <span>| AI 提示词库</span></div>
  <div class="nav-stats"><span><strong id="totalPrompts">0</strong> 提示词</span><span><strong>6</strong> 分类</span></div>
</div>

<div class="hero">
  <h1>🔮 让 AI 输出质量提升 10 倍</h1>
  <p>精选自全球顶级提示词库 · 中英双语 · 社区持续更新<br>覆盖写作、编程、商业、学习、创意、高阶六大场景</p>
</div>

<div class="container">
  <div class="sidebar">
    <div class="sidebar-sticky">
      <h3>📂 分类</h3>
      <div class="cat-list" id="catList"></div>
      <div class="sidebar-actions">
        <button class="btn-primary" onclick="openSubmit()">✏️ 投稿</button>
        <button onclick="document.getElementById('donateCard').scrollIntoView({behavior:'smooth'})">☕ 赞赏</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="icon">🔍</span>
        <input type="text" id="search" placeholder="搜索提示词..." oninput="render()">
      </div>
      <button class="sort-btn" id="sortVotes" onclick="setSort('votes')">📊 热门</button>
      <button class="sort-btn" id="sortNew" onclick="setSort('new')">🕐 最新</button>
    </div>

    <div id="donateCard" class="donate">
      <h3>☕ 赞赏支持</h3>
      <p>如果这些提示词帮到了你，可以请我喝杯咖啡 ❤️</p>
      <img src="donate.jpg" alt="赞赏码" loading="lazy">
      <div class="hint">扫码随意赞赏 · 感谢每一份支持</div>
    </div>

    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-wrap">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-cat" id="mCat"></div>
    <div class="modal-title" id="mTitle"></div>
    <div class="modal-desc" id="mDesc"></div>
    <div class="modal-langs">
      <button class="lang-tab active" onclick="switchLang('zh')">🇨🇳 中文</button>
      <button class="lang-tab" onclick="switchLang('en')">🇺🇸 English</button>
    </div>
    <div class="modal-prompt" id="mPrompt"></div>
    <div class="modal-footer">
      <div class="modal-votes">❤️ <span id="mVotes">0</span></div>
      <button class="copy-btn" onclick="copyPrompt()" style="font-size:0.82rem;padding:0.35rem 0.8rem">📋 复制提示词</button>
    </div>
  </div>
</div>

<!-- Submit Modal -->
<div class="modal-overlay" id="submitModal" onclick="if(event.target===this)closeSubmit()">
  <div class="modal-wrap" style="max-width:540px">
    <button class="modal-close" onclick="closeSubmit()">✕</button>
    <h2 style="font-size:1.1rem;margin-bottom:1rem">📝 投稿提示词</h2>
    <label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:0.2rem;color:var(--text3)">分类</label>
    <select id="sCat" style="width:100%;padding:0.5rem 0.7rem;border:1px solid var(--border);border-radius:8px;font-size:0.85rem;font-family:inherit;margin-bottom:0.6rem">
      <option value="writing">写作</option><option value="code">编程</option><option value="business">商业</option><option value="study">学习</option><option value="creative">创意</option><option value="advanced">高阶</option>
    </select>
    <label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:0.2rem;color:var(--text3)">标题</label>
    <input id="sTitle" style="width:100%;padding:0.5rem 0.7rem;border:1px solid var(--border);border-radius:8px;font-size:0.85rem;font-family:inherit;margin-bottom:0.6rem" placeholder="例如：小红书爆款文案生成器">
    <label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:0.2rem;color:var(--text3)">简短描述</label>
    <input id="sDesc" style="width:100%;padding:0.5rem 0.7rem;border:1px solid var(--border);border-radius:8px;font-size:0.85rem;font-family:inherit;margin-bottom:0.6rem" placeholder="一句话说明用途">
    <label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:0.2rem;color:var(--text3)">中文提示词</label>
    <textarea id="sZH" style="width:100%;padding:0.5rem 0.7rem;border:1px solid var(--border);border-radius:8px;font-size:0.82rem;font-family:monospace;min-height:80px;margin-bottom:0.6rem;resize:vertical" placeholder="中文版提示词..."></textarea>
    <label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:0.2rem;color:var(--text3)">English Version</label>
    <textarea id="sEN" style="width:100%;padding:0.5rem 0.7rem;border:1px solid var(--border);border-radius:8px;font-size:0.82rem;font-family:monospace;min-height:80px;margin-bottom:0.6rem;resize:vertical" placeholder="English version..."></textarea>
    <label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:0.2rem;color:var(--text3)">昵称（可选）</label>
    <input id="sAuthor" style="width:100%;padding:0.5rem 0.7rem;border:1px solid var(--border);border-radius:8px;font-size:0.85rem;font-family:inherit;margin-bottom:1rem" placeholder="匿名">
    <div style="display:flex;gap:0.5rem;justify-content:flex-end">
      <button onclick="closeSubmit()" style="padding:0.5rem 1.2rem;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:inherit;font-size:0.85rem">取消</button>
      <button onclick="submitPrompt()" style="padding:0.5rem 1.2rem;border-radius:8px;border:none;background:var(--primary);color:#fff;cursor:pointer;font-family:inherit;font-weight:600;font-size:0.85rem">提交</button>
    </div>
  </div>
</div>

<footer>
  <p>PromptHub · 精选 AI 提示词库 · <a href="https://github.com/yuanweibi-bot/prompt-hub" target="_blank">GitHub</a></p>
  <p style="margin-top:0.2rem">让 AI 对话更高效 · 收录高质量中英文提示词</p>
</footer>

<script>
const CATS = ['writing','code','business','study','creative','advanced','image','lifestyle','global'];
const CAT_LABEL = {writing:'📝 写作',code:'💻 编程',business:'💼 商业',study:'📚 学习',creative:'🎨 创意',advanced:'🚀 高阶',image:'🖼️ 绘画',lifestyle:'🧘 生活',global:'🌐 跨境'};

let prompts = [];
let currentCat = 'all';
let sortMode = 'new';
let currentPrompt = null;
let currentLang = 'zh';

// Load prompts
async function init() {
  try {
    const r = await fetch('prompts.json');
    prompts = await r.json();
    // Load local submissions
    const saved = localStorage.getItem('ph_prompts_v2');
    if (saved) {
      const sub = JSON.parse(saved);
      if (sub.length) {
        prompts = [...prompts, ...sub];
      }
    }
  } catch(e) {
    prompts = [];
  }
  buildCats();
  render();
}

function buildCats() {
  const counts = {};
  prompts.forEach(p => { counts[p.cat] = (counts[p.cat] || 0) + 1; });
  const list = document.getElementById('catList');
  list.innerHTML = '<button class="cat-btn active" data-cat="all" onclick="setCat(\'all\')">🏠 全部 <span class="count">'+prompts.length+'</span></button>';
  CATS.forEach(cat => {
    list.innerHTML += '<button class="cat-btn" data-cat="'+cat+'" onclick="setCat(\''+cat+'\')">'+CAT_LABEL[cat]+' <span class="count">'+(counts[cat]||0)+'</span></button>';
  });
}

function setCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  render();
}

function setSort(mode) {
  sortMode = mode;
  document.getElementById('sortVotes').classList.toggle('active', mode === 'votes');
  document.getElementById('sortNew').classList.toggle('active', mode === 'new');
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  let list = currentCat === 'all' ? [...prompts] : prompts.filter(p => p.cat === currentCat);
  if (q) list = list.filter(p => p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || (p.prompt_zh||'').toLowerCase().includes(q) || (p.prompt_en||'').toLowerCase().includes(q));
  
  if (sortMode === 'votes') list.sort((a,b) => b.votes - a.votes);
  else list.sort((a,b) => (b.id||0) - (a.id||0));

  document.getElementById('totalPrompts').textContent = prompts.length;

  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty">没有找到匹配的提示词 😅<br><br><button onclick="openSubmit()" style="padding:0.5rem 1.2rem;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:inherit">投稿第一个 →</button></div>';
    return;
  }

  grid.innerHTML = list.map(p => {
    const preview = (p.prompt_zh || p.prompt_en || '').substring(0, 130);
    return `<div class="pcard" onclick="openDetail(${p.id})">
      <div class="pcard-top">
        <span class="pcard-cat">${CAT_LABEL[p.cat]||p.cat}</span>
        <span class="pcard-author">${p.author||'社区'}</span>
      </div>
      <div class="pcard-title">${esc(p.title)}</div>
      <div class="pcard-desc">${esc(p.desc||'')}</div>
      <div class="pcard-preview">${esc(preview)}${(p.prompt_zh||p.prompt_en||'').length>130?'...':''}</div>
      <div class="pcard-footer">
        <button class="vote-btn" onclick="event.stopPropagation();upvote(${p.id})">👍</button>
        <span>${p.votes||0}</span>
        <span class="lang-badge">中/EN</span>
        <span class="date-badge">${p.date||'2026-05'}</span>
        <button class="copy-btn" onclick="event.stopPropagation();quickCopy(${p.id})">📋 复制</button>
      </div>
    </div>`;
  }).join('');
}

function esc(t){if(!t)return'';const d=document.createElement('div');d.textContent=t;return d.innerHTML}

function upvote(id) {
  const p = prompts.find(x => x.id === id);
  if (p) { p.votes++; render(); }
}

function openDetail(id) {
  currentPrompt = prompts.find(p => p.id === id);
  if (!currentPrompt) return;
  currentLang = 'zh';
  document.getElementById('mCat').textContent = CAT_LABEL[currentPrompt.cat] || currentPrompt.cat;
  document.getElementById('mTitle').textContent = currentPrompt.title;
  document.getElementById('mDesc').textContent = currentPrompt.desc;
  document.getElementById('mPrompt').textContent = currentPrompt.prompt_zh || currentPrompt.prompt_en || '';
  document.getElementById('mVotes').textContent = currentPrompt.votes || 0;
  document.querySelectorAll('.lang-tab').forEach((t,i) => t.classList.toggle('active', i === 0));
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
}

function switchLang(lang) {
  if (!currentPrompt) return;
  currentLang = lang;
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.lang-tab')[lang === 'zh' ? 0 : 1].classList.add('active');
  document.getElementById('mPrompt').textContent = lang === 'zh' ? (currentPrompt.prompt_zh || currentPrompt.prompt_en) : (currentPrompt.prompt_en || currentPrompt.prompt_zh);
}

function quickCopy(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;
  const text = p.prompt_zh || p.prompt_en || '';
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✅';
    setTimeout(() => btn.textContent = orig, 1000);
  }).catch(() => {});
}

function copyPrompt() {
  const text = document.getElementById('mPrompt').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.modal-footer .copy-btn');
    const orig = btn.textContent;
    btn.textContent = '✅ 已复制';
    setTimeout(() => btn.textContent = orig, 1200);
  }).catch(() => {});
}

function openSubmit() { document.getElementById('submitModal').classList.add('active'); document.body.style.overflow='hidden'; }
function closeSubmit() { document.getElementById('submitModal').classList.remove('active'); document.body.style.overflow=''; }

function submitPrompt() {
  const cat = document.getElementById('sCat').value;
  const title = document.getElementById('sTitle').value.trim();
  const desc = document.getElementById('sDesc').value.trim();
  const zh = document.getElementById('sZH').value.trim();
  const en = document.getElementById('sEN').value.trim();
  const author = document.getElementById('sAuthor').value.trim() || '社区用户';
  if (!title || !desc || (!zh && !en)) { alert('请填写标题、描述和至少一个语言的提示词'); return; }

  const now = new Date();
  const dateStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const np = { id: Date.now(), cat, title, desc, prompt_zh: zh, prompt_en: en, author, votes: 0, date: dateStr };
  prompts.push(np);
  
  try {
    const saved = JSON.parse(localStorage.getItem('ph_prompts_v2') || '[]');
    saved.push(np);
    localStorage.setItem('ph_prompts_v2', JSON.stringify(saved));
  } catch(e) {}
  
  closeSubmit();
  ['sCat','sTitle','sDesc','sZH','sEN','sAuthor'].forEach(id => document.getElementById(id).value = '');
  buildCats();
  render();
}

init();
</script>
